spring:
  application:
    name: ms-customer
  datasource:
    url: jdbc:h2:mem:customerdb
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    discovery:
      enabled: true
    config:
      enabled: false

server:
  port: 8000
eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true