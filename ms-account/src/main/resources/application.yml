spring:
  application:
    name: "ms-account"
  datasource:
    url: "jdbc:h2:mem:accountdb"
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    discovery:
      enabled: true
    config:
      enabled: false

server:
  port: 8100
eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true

